<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6bed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b24" media="(prefers-color-scheme: dark)">
<meta name="description" content="Private, offline spending tracker. Your data stays on this device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spending">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>Spending Tracker</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--panel-2:#f8f9fc;--text:#1b2130;--muted:#677087;--border:#e2e6ef;--accent:#4f6bed;--accent-2:#eaeefe;--accent-text:#fff;--danger:#e5484d;--good:#2f9e6b;--warn:#e8a33d;--input:#fff;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1117;--panel:#171b24;--panel-2:#1d2230;--text:#e6e9f0;--muted:#939bb0;--border:#2a3040;--accent:#7b93ff;--accent-2:#242c45;--accent-text:#0e1117;--input:#11151d;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1117;--panel:#171b24;--panel-2:#1d2230;--text:#e6e9f0;--muted:#939bb0;--border:#2a3040;--accent:#7b93ff;--accent-2:#242c45;--accent-text:#0e1117;--input:#11151d;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:8px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#a66cff);display:grid;place-items:center;color:#fff;font-size:15px}
nav.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center}
.badge:empty{display:none}
.review-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.review-row .raw{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.review-row .stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.review-row select{min-width:180px}
.tx-raw{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
nav.tabs button.active{background:var(--accent-2);color:var(--accent)}
nav.tabs button:hover{color:var(--text)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 8px;font-size:12px}
.btn.icon{padding:6px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1240px;margin:0 auto;padding:18px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:500;color:var(--muted)}
.kpi .label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .value{font-size:24px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--danger)}.down{color:var(--good)}
.pos{color:var(--good)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar h2{margin:0;font-size:20px;margin-right:auto}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.muted{color:var(--muted)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.dropzone{border:2px dashed var(--border);border-radius:14px;padding:44px 20px;text-align:center;cursor:pointer;background:var(--panel)}
.dropzone:hover{border-color:var(--accent)}
.dropzone .big{font-size:40px}
#dropOverlay{position:fixed;inset:0;background:rgba(79,107,237,.18);backdrop-filter:blur(2px);z-index:100;display:none;place-items:center;pointer-events:none}
#dropOverlay.show{display:grid}
#dropOverlay div{background:var(--panel);border:2px dashed var(--accent);padding:30px 40px;border-radius:16px;font-size:18px;font-weight:700}
.chart-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:200px;height:200px;flex:0 0 auto;margin:0 auto}
.legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.legend .row{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px}
.legend .row:hover{background:var(--panel-2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .amt{font-variant-numeric:tabular-nums;font-weight:600}
.legend .pct{color:var(--muted);width:42px;text-align:right;font-size:12px}
svg text{fill:var(--muted);font-size:11px}
svg .grid-line{stroke:var(--border);stroke-width:1}
svg .bar-spend{fill:var(--accent)}
svg .bar-income{fill:var(--good);opacity:.85}
svg .bar-sel{stroke:var(--text);stroke-width:1.5}
svg .center-big{fill:var(--text);font-size:17px;font-weight:700}
svg .slice{stroke:var(--panel)}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover{fill:var(--accent-2);opacity:.5}
.list{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.hbar .track{grid-column:1/-1;height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.hbar .fill{height:100%;border-radius:4px;background:var(--accent)}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .amt{font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel-2);border:1px solid var(--border);white-space:nowrap}
.pill .sw{width:8px;height:8px;border-radius:50%}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--panel-2)}
.tx-desc{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-desc .note{display:block;font-size:12px;color:var(--muted)}
.cat-select{max-width:170px;padding:4px 6px;font-size:13px}
.row-actions{white-space:nowrap;text-align:right}
.table-wrap{overflow-x:auto}
.summary-line{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:8px 2px}
.summary-line b{color:var(--text)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px;padding-top:max(30px,calc(env(safe-area-inset-top) + 12px));padding-bottom:max(30px,calc(env(safe-area-inset-bottom) + 12px))}
.file-hidden{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#updateBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:210;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:8px 8px 8px 14px;display:flex;gap:8px;align-items:center;max-width:94vw}
.backup-note{border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.backup-note.due{border-color:var(--warn)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:1000px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;gap:10px}
.modal .body{padding:16px 18px}
.modal footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;gap:8px}
.mini-table{font-size:12px;overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:240px}
.mini-table table td,.mini-table table th{padding:5px 8px;white-space:nowrap}
.mini-table th{position:sticky;top:0;background:var(--panel-2)}
.err{color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}
.warnbox{background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.4);padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0}
.section-title{font-size:13px;font-weight:700;margin:16px 0 8px}
#toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:13px;animation:tin .2s ease}
.toast.error{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.budget-row{display:grid;grid-template-columns:minmax(120px,1.2fr) 130px minmax(140px,2fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.progress{height:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.progress>div{height:100%;background:var(--good);border-radius:6px}
.progress.warn>div{background:var(--warn)}
.progress.over>div{background:var(--danger)}
.prog-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.cat-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cat-row input[type=color]{width:34px;height:30px;border:1px solid var(--border);border-radius:6px;padding:2px;background:var(--input)}
.cat-row input[type=text]{flex:1;min-width:120px}
.rules-list{max-height:460px;overflow-y:auto;border:1px solid var(--border);border-radius:10px}
.rules-list table td{padding:5px 8px}
.rules-list input[type=text]{width:100%}
.month-nav{display:flex;align-items:center;gap:6px}
.recurring-total{font-size:13px;color:var(--muted);margin-top:10px}
@media (max-width:700px),(pointer:coarse){
  /* touch: tap targets >= 44px, 16px form text so iOS doesn't zoom on focus */
  .btn,.btn.small,.btn.icon{min-height:44px;min-width:44px;justify-content:center}
  .btn.small{font-size:13px;padding:6px 10px}
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{min-height:44px;font-size:16px}
  input[type=color]{min-height:44px;min-width:44px}
  nav.tabs button{min-height:44px}
  .legend .row,.hbar,#trend [data-month]{min-height:44px}
  .modal .btn{min-height:44px}
}
@media (max-width:700px){
  main{padding:12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .topbar{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));gap:8px}
  nav.tabs{order:3;flex-basis:100%}
  nav.tabs button{flex:1;padding:8px 4px;font-size:13px}
  .review-row{grid-template-columns:1fr}
  .review-row select{width:100%}
  .top-actions{margin-left:auto}
  .top-actions .lbl{display:none}
  .cols-2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .value{font-size:19px}
  .donut{width:170px;height:170px}
  #txTable thead{display:none}
  #txTable,#txTable tbody,#txTable tr,#txTable td{display:block;width:100%}
  #txTable tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 4px;border-bottom:1px solid var(--border)}
  #txTable td{border:0;padding:0}
  #txTable td.c-date{grid-column:1;font-size:12px;color:var(--muted)}
  #txTable td.c-amt{grid-column:2;grid-row:1/3;align-self:center;font-size:15px;font-weight:700}
  #txTable td.c-desc{grid-column:1;max-width:none;white-space:normal}
  #txTable td.c-cat{grid-column:1}
  #txTable td.c-act{grid-column:2;text-align:right}
  .budget-row{grid-template-columns:1fr 110px}
  .budget-row .bp{grid-column:1/-1}
  .hide-sm{display:none}
  .rules-list table,.rules-list tbody{display:block}
  .rules-list tr{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
  .rules-list td{padding:0!important;width:auto!important;border:0}
  .rules-list td:first-child{grid-column:1/-1}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"><svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="3"/><path d="M16 16V6.5A9.5 9.5 0 0 1 25.5 16Z" fill="#fff"/></svg></span><span>Spending Tracker</span></div>
  <nav class="tabs" id="tabs">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="transactions">Transactions</button>
    <button data-view="review" title="Review uncategorized transactions">Review<span class="badge" id="reviewBadge"></span></button>
    <button data-view="budgets">Budgets</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div class="top-actions">
    <button class="btn primary" id="importBtn" title="Import CSV or Excel (.xlsx) statement(s)">⤓ <span class="lbl">Import CSV / Excel</span></button>
    <button class="btn icon" id="themeBtn" title="Toggle light/dark mode">◐</button>
  </div>
</header>
<main>
  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-transactions"></section>
  <section class="view" id="view-review"></section>
  <section class="view" id="view-budgets"></section>
  <section class="view" id="view-settings"></section>
</main>
<input type="file" id="fileInput" accept=".csv,.txt,.tsv,.xlsx,.xlsm,text/csv,text/comma-separated-values,application/csv,text/tab-separated-values,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12,application/vnd.ms-excel,application/zip,application/octet-stream" multiple class="file-hidden" tabindex="-1" aria-hidden="true">
<input type="file" id="jsonInput" accept=".json,application/json,text/plain,application/octet-stream" class="file-hidden" tabindex="-1" aria-hidden="true">
<div id="dropOverlay"><div>Drop CSV or .xlsx statement files to import</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>
<noscript><p style="padding:20px">This app needs JavaScript enabled.</p></noscript>
<script>
'use strict';
/* Spending Tracker: single-file, offline. All data stays in this browser's localStorage. */
const LS_KEY = 'spendingTracker.v1';
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2 = x => Math.round(x * 100) / 100;
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const DEFAULT_CATS = [
  ['Groceries','#2f9e6b','expense'],['Dining','#f08c00','expense'],['Transport','#1c7ed6','expense'],
  ['Shopping','#d6336c','expense'],['Bills & Utilities','#7048e8','expense'],['Subscriptions','#ae3ec9','expense'],
  ['Entertainment','#f76707','expense'],['Health','#0ca678','expense'],['Travel','#1098ad','expense'],
  ['Income','#37b24d','income'],['Transfers','#868e96','transfer'],['Other','#a0a7b4','expense']
];
/* Generic build: no local/personal rules. */
const LOCAL_RULES = {}, LOCAL_CITIES = [], LOCAL_LOC_ABBR = [];
// Order matters: first matching rule wins (user rules are inserted at the top).
const DEFAULT_RULES = [
  ['Transfers', ['transfer','internal transfer','to savings','from savings','venmo','zelle','swish','payment thank you','credit card payment','card payment received','autopay','överföring','overforing','revolut top-up','atm withdrawal','cash withdrawal','bankomat','/^\\s*\\+?\\d[\\d\\s-]{6,}\\s*$/']],
  ['Income', ['salary','payroll','direct deposit','lön','wages','dividend','interest paid','interest earned','tax refund','skatteåterbäring','pension','paycheck','reimbursement']],
  ['Subscriptions', ['netflix','spotify','hulu','disney+','disney plus','hbo','max.com','youtube premium','apple.com/bill','icloud','google storage','google one','amazon prime','prime video','adobe','microsoft 365','office 365','dropbox','chatgpt','openai','patreon','audible','storytel','viaplay','crunchyroll','paramount+','duolingo','notion','github','1password','nordvpn']],
  ['Dining', ['uber eats','ubereats','doordash','grubhub','deliveroo','foodora','wolt','just eat','restaurant','restaurang','cafe','café','coffee','starbucks','espresso house','mcdonald','mcdonalds','mcdonald\'s','burger','burger king','max burgers','pizza','pizzeria','sushi','chipotle','kfc','taco bell','dunkin','bistro','grill','kitchen','bar','pub','diner','bakery','pret','five guys','panera','tim hortons','kebab','ramen','glassbar','sushibar']],

    out.push({ name, avg: round2(avg), months: ms.length, last, category: cat, active: periodOf(last) >= prevMonth(lastMonth) });
  }
  return out.sort((a, b) => (b.active - a.active) || b.avg - a.avg);
}

/* ---------------- Charts (hand-written SVG) ---------------- */
function donutSVG(items, total, centerLabel) {
  const R = 90, r = 58, cx = 100, cy = 100;
  let a0 = -Math.PI / 2, paths = '';
  const pt = (rad, a) => [(cx + rad * Math.cos(a)).toFixed(2), (cy + rad * Math.sin(a)).toFixed(2)];
  if (items.length === 1) {
    paths = `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${items[0].color}" stroke-width="${R - r}"><title>${esc(items[0].name)}: ${esc(fmt(items[0].value))}</title></circle>`;
  } else {
    for (const it of items) {
      const frac = it.value / total; if (frac <= 0) continue;
      const a1 = a0 + frac * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0;
      const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0);
      paths += `<path class="slice" data-cat="${esc(it.name)}" d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${it.color}" stroke-width="1.5" style="cursor:pointer"><title>${esc(it.name)}: ${esc(fmt(it.value))} (${(frac * 100).toFixed(1)}%)</title></path>`;
      a0 = a1;
    }
  }
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Spending by category">${paths}
    <text x="100" y="98" text-anchor="middle" class="center-big">${esc(fmtShort(total))}</text>
    <text x="100" y="117" text-anchor="middle">${esc(centerLabel)}</text></svg>`;
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function trendSVG(months, data, selected) {
  const W = window.innerWidth < 700 ? 360 : 560, H = window.innerWidth < 700 ? 220 : 260, padL = 52, padR = 10, padT = 12, padB = 30;
  const nice = niceMax(Math.max(1, ...data.map(d => Math.max(d.spent, d.income))));
  const cw = (W - padL - padR) / months.length, bw = Math.max(3, Math.min(20, cw * 0.32));
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  let s = '';
  for (let k = 0; k <= 4; k++) { const v = nice * k / 4, yy = y(v).toFixed(1); s += `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}"/><text x="${padL - 6}" y="${+yy + 4}" text-anchor="end">${esc(fmtShort(v))}</text>`; }
  months.forEach((m, i) => {
    const d = data[i], x = padL + cw * i + cw / 2, isSel = m === selected;
    s += `<rect class="hit" x="${(padL + cw * i).toFixed(1)}" y="${padT}" width="${cw.toFixed(1)}" height="${H - padT - padB}" data-month="${m}"><title>${esc(monthLabel(m))}&#10;Spent: ${esc(fmt(d.spent))}&#10;Income: ${esc(fmt(d.income))}</title></rect>`;
    const sh = Math.max(0, y(0) - y(Math.max(0, d.spent))), ih = Math.max(0, y(0) - y(Math.max(0, d.income)));
    s += `<rect class="bar-spend${isSel ? ' bar-sel' : ''}" x="${(x - bw - 1).toFixed(1)}" y="${(y(0) - sh).toFixed(1)}" width="${bw.toFixed(1)}" height="${sh.toFixed(1)}" rx="2" pointer-events="none"/>`;
    s += `<rect class="bar-income${isSel ? ' bar-sel' : ''}" x="${(x + 1).toFixed(1)}" y="${(y(0) - ih).toFixed(1)}" width="${bw.toFixed(1)}" height="${ih.toFixed(1)}" rx="2" pointer-events="none"/>`;
    if (months.length <= 12 || i % Math.ceil(months.length / 12) === 0)
      s += `<text x="${x.toFixed(1)}" y="${H - 10}" text-anchor="middle" style="${isSel ? 'fill:var(--text);font-weight:700' : ''}">${MONTHS_SHORT[+m.slice(5, 7) - 1]}${m.slice(5, 7) === '01' || i === 0 ? ' ’' + m.slice(2, 4) : ''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly spending and income">${s}</svg>
    <div class="summary-line"><span class="pill"><span class="sw" style="background:var(--accent)"></span>Spent</span><span class="pill"><span class="sw" style="background:var(--good)"></span>Income</span><span class="hint">Click a ${S.settings.periodMode === 'calendar' ? 'month' : 'period'} to select it</span></div>`;
}

function filteredTxns() {

// After a manual category change: offer to apply to similar merchants and save as a rule.
function offerRule(t) {
  const matches = p => { const re = compilePattern(p); return re ? S.txns.filter(x => x !== t && re.test(' ' + x.desc.toLowerCase() + ' ') && x.category !== t.category) : null; };
  openModal('Category set to ' + t.category, `
    <p style="margin-top:0">Also categorize similar transactions as <b>${esc(t.category)}</b> and remember this as a rule for future imports?</p>
    <div class="field"><label>Match descriptions containing (word/phrase, or /regex/)</label><input type="text" id="rulePat" value="${esc(merchantKey(t.desc).toLowerCase())}"></div>
    <p class="hint" id="ruleCount"></p>`, [
    { label: 'Just this one', cancel: true },
    { label: 'Apply to similar & create rule', cls: 'primary', onClick: () => {
      const p = $('#rulePat').value.trim(); const list = matches(p);
      if (!p || !list) { toast('Invalid pattern', true); return false; }
      S.rules.unshift({ id: uid(), pattern: p, category: t.category, user: true }); invalidateRules();
      list.forEach(x => { x.category = t.category; x.catManual = false; });
      save(); toast(`Rule created · ${list.length} other transaction${list.length === 1 ? '' : 's'} updated`);
    } }
  ], { onClose: () => renderAll() });
  const upd = () => { const l = matches($('#rulePat').value.trim()); $('#ruleCount').textContent = !l ? 'Invalid pattern' : `${l.length} other existing transaction${l.length === 1 ? '' : 's'} would change to ${t.category}.`; };
  $('#rulePat').oninput = upd; upd();
}
function editTxn(t) {

      <div class="field" style="grid-column:1/-1"><label for="eNote">Note (optional)</label><input type="text" id="eNote" value="${esc(d.note)}"></div>
    </div>`, [

      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('Please enter a valid date', true); return false; }
      if (!desc) { toast('Please enter a description', true); return false; }
      if (!isFinite(a) || a === 0) { toast('Please enter an amount', true); return false; }
      const obj = t || { id: uid(), source: 'manual' };
      obj.date = date; obj.desc = desc; obj.amount = round2(($('#eType').value === 'in' ? 1 : -1) * Math.abs(a)); obj.note = $('#eNote').value.trim();
      const sv = $('#eSal').value; obj.salary = sv === 'yes' ? true : sv === 'no' ? false : undefined;

      else { if (isNew || c !== d.category) obj.catManual = true; obj.category = c; }
      obj.key = dedupeKey(obj);
      if (isNew) S.txns.push(obj);
      save(); renderAll(); toast(isNew ? 'Transaction added' : 'Transaction saved');
    } }
  ]);
}

// ---- Review uncategorized: group 'Other' by cleaned merchant; one pick categorizes the group + saves a rule
function reviewGroups() {
  const pool = S.txns.filter(t => t.category === 'Other' || (ui.reviewIncome && t.amount > 0 && catType(t.category) === 'income' && !t.catManual && !matchRule(cleanDescription(t.desc)) && !matchRule(t.desc) && !fuzzyMatchRule(cleanDescription(t.desc))));
  const g = {};
  for (const t of pool) {
    const k = merchantKey(t.desc);
    const o = g[k] || (g[k] = { name: k, txns: [], total: 0, raws: new Set(), from: t.date, to: t.date });
    o.txns.push(t); o.total += t.amount; o.raws.add(t.desc);
    if (t.date < o.from) o.from = t.date; if (t.date > o.to) o.to = t.date;
  }
  return { pool, groups: Object.values(g).sort((a, b) => b.txns.length - a.txns.length || Math.abs(b.total) - Math.abs(a.total)) };
}
function renderReview() {
  const el = $('#view-review');
  const { pool, groups } = reviewGroups();
  const nOther = S.txns.filter(t => t.category === 'Other').length;
  el.innerHTML = `
  <div class="toolbar"><h2>Review uncategorized</h2>
    <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="revInc"${ui.reviewIncome ? ' checked' : ''}> Also show unrecognised money-in (auto-filed as Income)</label></div>
  <div class="card">
    <p class="hint" style="margin-top:0">${S.txns.length ? `<b>${nOther}</b> of ${S.txns.length} transactions (${(nOther / S.txns.length * 100).toFixed(1)}%) are in "Other". ` : ''}Grouped by cleaned merchant name, most frequent first. Choosing a category files <b>every</b> transaction in the group and saves a rule, so future imports are categorized automatically.</p>
    ${groups.length ? groups.map((gr, i) => `<div class="review-row" data-g="${i}">
      <div style="min-width:0"><div style="font-weight:650">${esc(gr.name)}</div>
        <div class="stats">${gr.txns.length}× · ${fmt(gr.total)} · ${esc(fmtDate(gr.from))}${gr.from !== gr.to ? ' – ' + esc(fmtDate(gr.to)) : ''}${gr.txns[0].category !== 'Other' ? ` · now ${esc(gr.txns[0].category)}` : ''}</div>
        <div class="raw" title="${esc([...gr.raws].join('\n'))}">Bank text: ${esc([...gr.raws].slice(0, 3).join(' · '))}${gr.raws.size > 3 ? ` (+${gr.raws.size - 3} more)` : ''}</div></div>
      <select data-revcat aria-label="Category for ${esc(gr.name)}"><option value="">Choose category…</option>${S.categories.filter(c => c.name !== 'Other').map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select>
    </div>`).join('') : `<div class="empty">${pool.length || nOther ? '' : 'Nothing to review. Every transaction has a category 🎉'}</div>`}
  </div>`;
  $('#revInc').onchange = e => { ui.reviewIncome = e.target.checked; renderReview(); };
  $$('#view-review [data-revcat]').forEach(sel => sel.onchange = () => {
    const gr = groups[+sel.closest('[data-g]').dataset.g], cat = sel.value; if (!gr || !cat) return;
    const pattern = cleanDescription(gr.txns[0].desc).toLowerCase().split(/\s+/).slice(0, 3).join(' ');
    const rulePattern = merchantKey(gr.txns[0].desc).toLowerCase() === '(unknown)' ? pattern : merchantKey(gr.txns[0].desc).toLowerCase();
    if (!S.rules.some(r => r.pattern.toLowerCase() === rulePattern && r.category === cat)) S.rules.unshift({ id: uid(), pattern: rulePattern, category: cat, user: true });
    invalidateRules();
    gr.txns.forEach(t => { t.category = cat; t.catManual = false; });
    // the new rule may also cover other uncategorized rows with the same cleaned name
    let extra = 0; S.txns.forEach(t => { if (t.category === 'Other' && !t.catManual && categorize(t) === cat) { t.category = cat; extra++; } });
    save(); renderAll();

  });
}

function renameCategory(oldN, newN) {
  const c = catByName(oldN); if (!c) return;
  c.name = newN;
  S.txns.forEach(t => { if (t.category === oldN) t.category = newN; });
  S.rules.forEach(r => { if (r.category === oldN) r.category = newN; });
  if (S.budgets[oldN] != null) { S.budgets[newN] = S.budgets[oldN]; delete S.budgets[oldN]; }
  if (ui.fCat === oldN) ui.fCat = newN;
  invalidateRules();
}

/* ---------------- Export / restore ---------------- */
function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const today = () => new Date().toISOString().slice(0, 10);
function exportJSON() { S.settings.lastBackup = new Date().toISOString(); save(); if (ui.view === 'settings') setTimeout(renderSettings, 0); download(`spending-tracker-backup-${today()}.json`, JSON.stringify(Object.assign({ app: 'spending-tracker', exportedAt: new Date().toISOString() }, S), null, 1), 'application/json'); toast('Backup downloaded'); }
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV(list) {
  const lines = ['Date,Description,Amount,Currency,Category,Note,Source'];
  list.forEach(t => lines.push([t.date, t.desc, t.amount.toFixed(2), S.settings.currency, t.category, t.note, t.source].map(csvCell).join(',')));
  download(`transactions-${today()}.csv`, '\uFEFF' + lines.join('\r\n'), 'text/csv;charset=utf-8'); toast(`Exported ${list.length} transactions`);
}
$('#jsonInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.txns)) throw new Error('not a Spending Tracker backup file');
    if (!confirm(`Restore backup "${f.name}" with ${data.txns.length} transactions?\nThis REPLACES all current data.`)) return;
    S = normalizeState(data); invalidateRules(); save(); ui.month = null; renderAll(); toast('Backup restored');
  } catch (err) { toast('Restore failed: ' + err.message, true); }
});

/* ---------------- Theme ---------------- */
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}
const effectiveDark = () => S.settings.theme === 'dark' || (S.settings.theme === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
$('#themeBtn').onclick = () => { S.settings.theme = effectiveDark() ? 'light' : 'dark'; save(); applyTheme(); if (ui.view === 'settings') renderSettings(); };

/* ---------------- Wiring ---------------- */
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (!b) return; ui.view = b.dataset.view; renderAll(); window.scrollTo(0, 0); });
$('#importBtn').onclick = () => $('#fileInput').click();
$('#fileInput').addEventListener('change', e => { const files = Array.from(e.target.files); e.target.value = ''; handleFiles(files); });
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#dropOverlay').classList.add('show'); });
window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropOverlay').classList.remove('show'); });
window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $('#dropOverlay').classList.remove('show'); handleFiles(e.dataTransfer.files); });
let _wasNarrow = window.innerWidth < 700;
window.addEventListener('resize', () => { const n = window.innerWidth < 700; if (n !== _wasNarrow) { _wasNarrow = n; if (ui.view === 'dashboard') renderDashboard(); } });
window.addEventListener('storage', e => { if (e.key === LS_KEY) { S = load(); invalidateRules(); renderAll(); } });

S = load();
// One-time re-categorization after cleaning changes (v2: Klarna "K*" marker). Manual categories are never touched.
if ((S.settings.cleanVersion || 0) < 2) {
  invalidateRules();
  S.txns.forEach(t => { if (!t.catManual && isViaKlarna(t.desc)) t.category = categorize(t); });
  S.settings.cleanVersion = 2; save();
}
renderAll();
// ---- Device storage: ask the browser to keep our data (iOS/Safari may evict site data after weeks of no use)
var storagePersisted = null;
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(p => { storagePersisted = !!p; if (ui.view === 'settings') renderSettings(); }).catch(() => {});
}
function backupNoteHTML() {
  if (!S.txns.length) return '';
  const lb = S.settings.lastBackup, days = lb ? Math.floor((Date.now() - new Date(lb).getTime()) / 86400000) : null, due = days === null || days >= 30;
  const when = days === null ? 'You haven\'t exported a backup yet.' : days === 0 ? 'Last backup: today.' : `Last backup: ${days} day${days === 1 ? '' : 's'} ago.`;
  return `<div class="backup-note${due ? ' due' : ''}" id="backupNote">💾 <b>${when}</b> ${due ? 'A quick JSON backup now and then keeps your history safe.' : ''}<br><span class="hint">Your data lives only on this device. iPhone/Safari can clear website storage if the app isn't opened for a while, and deleting the Home Screen app deletes its data, so keep a backup in Files or iCloud Drive.${storagePersisted === true ? ' Persistent storage is granted.' : ''}</span></div>`;
}

// ---- Installed app (PWA): register the service worker only when served over http(s) with a manifest (index.html in pwa/)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
  let reloading = false;
  const showUpdate = reg => {
    if (!reg.waiting || document.getElementById('updateBar')) return;
    const bar = document.createElement('div'); bar.id = 'updateBar'; bar.setAttribute('role', 'status');
    bar.innerHTML = '<span>A new version is available.</span><button class="btn primary small" id="updNow">Update</button><button class="btn small" id="updLater" aria-label="Later">Later</button>';
    document.body.appendChild(bar);
    $('#updNow').onclick = () => { if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); bar.remove(); };
    $('#updLater').onclick = () => bar.remove();
  };
  const hadController = !!navigator.serviceWorker.controller;   // first install (clients.claim) must not reload the page
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloading) { reloading = true; location.reload(); } });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(reg); }); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
}

// Small console API (handy for power users and automated tests)
window.SpendingTracker = { get state() { return S; }, cleanDescription, displayName, isViaKlarna, dedupeKey, fuzzyMatchRule, matchRule, parseXlsx, inflateRawJS, excelSerialToISO, isDateFormatCode, parseCSV, detectDelimiter, parseDate, parseAmount, buildConfig, buildTxns, merchantKey, categorize, detectRecurring, summarize, getPeriods, periodOf, paydayDate, monthLabel, isSalary, allMonths, prevMonth, daysLeftText, periodRangeText };
</script>
