<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spending Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo"><svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="3"/><path d="M16 16V6.5A9.5 9.5 0 0 1 25.5 16Z" fill="#fff"/></svg></span><span>Spending Tracker</span></div>
  <nav class="tabs" id="tabs">
    <button data-view="dashboard" class="active"><span class="tab-long">Dashboard</span><span class="tab-short">Home</span></button>
    <button data-view="transactions"><span class="tab-long">Transactions</span><span class="tab-short">Activity</span></button>
    <button data-view="review" title="Review uncategorized transactions">Review<span class="badge" id="reviewBadge"></span></button>
    <button data-view="budgets">Budgets</button>
    <button data-view="plan">Plan</button>
    <button data-view="settings" aria-label="Settings"><span class="tab-long">Settings</span><span class="tab-short" aria-hidden="true">⚙︎</span></button>
  </nav>
  <div class="top-actions">
    <button class="btn primary" id="importBtn" title="Import CSV or Excel (.xlsx) statement(s)">⤓ <span class="lbl">Import CSV / Excel</span></button>
    <button class="btn icon" id="themeBtn" title="Toggle light/dark mode">◐</button>
  </div>
</header>
<main>
  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-transactions"></section>
  <section class="view" id="view-review"></section>
  <section class="view" id="view-budgets"></section>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-settings"></section>
</main>
<input type="file" id="fileInput" accept=".csv,.txt,.tsv,.xlsx,.xlsm,text/csv,text/comma-separated-values,application/csv,text/tab-separated-values,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12,application/vnd.ms-excel,application/zip,application/octet-stream" multiple class="file-hidden" tabindex="-1" aria-hidden="true">
<input type="file" id="jsonInput" accept=".json,application/json,text/plain,application/octet-stream" class="file-hidden" tabindex="-1" aria-hidden="true">
<div id="dropOverlay"><div>Drop CSV or .xlsx statement files to import</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>
<noscript><p style="padding:20px">This app needs JavaScript enabled.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
